name: Run SAMA Musicbot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Har 30 daqiqada qayta tekshirib turadi

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository'ni yuklab olish
      uses: actions/checkout@v4

    - name: Python o'rnatish
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botni fonda ishga tushirish
      run: |
        nohup python bot.py > bot.log 2>&1 &
        sleep 5
        ps aux | grep bot.py
